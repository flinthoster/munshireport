<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistem Aduan Murid | SMK Munshi Abdullah</title>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
    emailjs.init({
        publicKey: "rJGRszAdT_5LYSJDQ"
    });
</script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{

    background:#f4fff6;

}

header{

    background:#198754;
    color:white;
    text-align:center;
    padding:30px;
    box-shadow:0 4px 10px rgba(0,0,0,.15);

}

header h1{

    font-size:34px;

}

header p{

    margin-top:8px;

}

.container{

    width:90%;
    max-width:850px;

    margin:40px auto;

    background:white;

    padding:35px;

    border-radius:15px;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

}

h2{

    color:#198754;

    margin-bottom:10px;

}

.desc{

    color:#666;

    margin-bottom:25px;

}

label{

    display:block;

    margin-top:18px;

    margin-bottom:7px;

    font-weight:bold;

}

input,
select,
textarea{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:15px;

}

input:focus,
select:focus,
textarea:focus{

    border:1px solid #198754;

    outline:none;

}

textarea{

    resize:vertical;

    min-height:170px;

}

button{

    width:100%;

    margin-top:25px;

    padding:15px;

    border:none;

    border-radius:8px;

    background:#198754;

    color:white;

    font-size:17px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#146c43;

}

.notice{

    margin-top:25px;

    background:#eaf8ef;

    padding:15px;

    border-left:5px solid #198754;

    border-radius:8px;

    color:#444;

}

footer{

    text-align:center;

    padding:20px;

    color:#666;

}

</style>

</head>

<body>

<header>

<h1>Sistem Aduan Murid</h1>

<p>SMK Munshi Abdullah</p>

</header>

<div class="container">

<h2>Borang Aduan</h2>

<p class="desc">

Sila isi maklumat di bawah dengan lengkap.

</p>

<form id="aduanForm">

<label>Nama Murid</label>

<input
id="nama"
type="text"
required
placeholder="Masukkan nama penuh">

<label>Kelas</label>

<input
id="kelas"
type="text"
required
placeholder="Contoh: 5 Sains 1">

<label>Jenis Aduan</label>

<select id="kategori" required>

<option value="">-- Pilih --</option>

<option>Kebersihan</option>

<option>Kerosakan Fasiliti</option>

<option>Keselamatan</option>

<option>Buli</option>

<option>Disiplin</option>

<option>Lain-lain</option>

</select>

<label>Lokasi</label>

<input
id="lokasi"
type="text"
required
placeholder="Contoh: Makmal Komputer">

<label>Butiran Aduan</label>

<textarea
id="aduan"
required
placeholder="Nyatakan aduan anda dengan jelas..."></textarea>

<button type="submit">

Hantar Aduan

</button>

</form>

<div class="notice">

<b>Makluman:</b>

Semua aduan akan dihantar terus kepada pihak sekolah melalui email.

</div>

</div>

<footer>

© 2026 SMK Munshi Abdullah

</footer>

<script>

const form=document.getElementById("aduanForm");

form.addEventListener("submit",function(e){

e.preventDefault();

const templateParams={

nama:document.getElementById("nama").value,

kelas:document.getElementById("kelas").value,

kategori:document.getElementById("kategori").value,

lokasi:document.getElementById("lokasi").value,

aduan:document.getElementById("aduan").value,

masa:new Date().toLocaleString("ms-MY")

};

emailjs.send(

"munshireports",

"template_indstih",

templateParams

)

.then(function(){

alert("✅ Aduan berjaya dihantar!");

form.reset();

})

.catch(function(error){

alert("❌ Gagal menghantar aduan.");

console.log(error);

});

});

</script>

</body>

</html>
